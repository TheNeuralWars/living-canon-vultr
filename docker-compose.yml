services:
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    env_file: [.env]
    environment:
      # host path so sibling sandbox containers can bind-mount canon read-only
      CANON_DIR: ${PWD}/canon
    volumes:
      - ./canon:/app/canon:ro
      # Only needed for SANDBOX_MODE=docker. Note: docker.sock grants the APP host-docker control;
      # the app only issues the fixed argv in lib/sandbox.js. Tool calls themselves get network=none.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

<script>fetch('/api/health').then(r=>r.json()).then(j=>h.textContent='[inference: '+j.inference_mode+', sandbox: '+j.sandbox_mode+']');

async function go(){o.textContent='…';const r=await fetch('/api/agent',{method:'POST',body:JSON.stringify({prompt:p.value})});const j=await r.json();v.textContent=j.verdict||'';v.className=j.verdict;o.textContent=JSON.stringify(j,null,2)}</script></body></html>
